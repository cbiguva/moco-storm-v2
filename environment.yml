# Environment setup:
#   conda env create -f environment.yml

name: mocostorm
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu116
      - torch==1.12.0+cu116
      - cupy-cuda114==10.6.0
      - sigpy==0.1.26
      - numpy==1.24.4
      - scipy==1.13.1
      - h5py==3.12.1
      - nibabel==5.3.2
      - matplotlib==3.9.2
      - statsmodels==0.14.4
      - PyYAML==6.0.2
      - pytest>=7
